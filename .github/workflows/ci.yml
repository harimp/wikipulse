name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  ingest:
    name: Ingest Lambdas (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ingest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: services/ingest/pyproject.toml
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  infra:
    name: Infrastructure (CDK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx cdk synth --quiet

  diff:
    name: cdk diff against production
    # Pull requests from this repo only (forks get no AWS credentials), and only
    # once the Foundation stack is deployed and the role ARN saved as a variable.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.AWS_DIFF_ROLE_ARN != ''
    needs: infra
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DIFF_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      # Template diff needs only the read-only CDK lookup role.
      - run: |
          {
            echo '### `cdk diff` against production'
            echo '```diff'
            npx cdk diff 'Prod/*' --method template 2>&1
            echo '```'
          } > diff.md
      - uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: cdk-diff
          path: infra/diff.md
