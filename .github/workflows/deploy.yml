name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; queue rather than cancel a half-finished CloudFormation update.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    # The deploy role trusts only this environment; add reviewers to it in the
    # repo settings if you want a manual approval gate.
    environment: production
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      # Foundation is deliberately excluded: changes to CI's own trust are made by hand.
      - run: npx cdk deploy 'Prod/*' --require-approval never
